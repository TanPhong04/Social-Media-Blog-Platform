name: CD — Deploy to VPS

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main, dev]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 1: Copy compose files & init.sql lên VPS
      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/compose/backend.compose.yml,infra/docker/infra.compose.yml,infra/postgres/init.sql"
          target: /opt/socialblog
          strip_components: 0

      # Bước 2: SSH vào VPS và chạy deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY
          script: |
            set -e

            APP_DIR=/opt/socialblog
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            BRANCH_TAG="${BRANCH//\//-}"

            cd $APP_DIR

            # Dọn dẹp cấu trúc thư mục sau khi scp
            [ -f deploy/compose/backend.compose.yml ] && mv deploy/compose/backend.compose.yml . 2>/dev/null || true
            [ -f infra/docker/infra.compose.yml ] && mv infra/docker/infra.compose.yml . 2>/dev/null || true
            [ -f infra/postgres/init.sql ] && mv infra/postgres/init.sql . 2>/dev/null || true
            rm -rf deploy infra 2>/dev/null || true

            # Ghi JWT keys ra file riêng (tránh lỗi parse ký tự đặc biệt + trong .env)
            echo "${{ secrets.JWT_PRIVATE_KEY }}" > jwt-private.pem
            echo "${{ secrets.JWT_PUBLIC_KEY }}"  > jwt-public.pem
            chmod 600 jwt-private.pem jwt-public.pem

            LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Ghi .env - chỉ chứa biến đơn giản, KHÔNG chứa JWT key
            cat > .env <<ENVEOF
            IMAGE_REGISTRY=ghcr.io
            IMAGE_NAMESPACE=${LOWERCASE_REPO}
            IMAGE_TAG=${BRANCH_TAG}
            SPRING_PROFILES_ACTIVE=prod
            OUTBOX_PUBLISHER_ENABLED=true
            KAFKA_CONSUMER_ENABLED=true
            BACKEND_NETWORK=social-blog-backend
            GATEWAY_PORT=8080
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_ISSUER=http://${{ secrets.VPS_HOST }}:8080
            JWT_KEY_ID=managed-rsa
            ENVEOF

            # Login GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull tất cả images song song
            SERVICES=(user-service article-service comment-service interaction-service follower-service notification-service api-gateway)
            for svc in "${SERVICES[@]}"; do
              docker pull "ghcr.io/${LOWERCASE_REPO}/${svc}:${BRANCH_TAG}" &
            done
            wait
            echo "All images pulled"

            # Khởi động infra (postgres, kafka, redis) trước
            docker compose -p socialblog-infra -f infra.compose.yml --env-file .env up -d

            # Chờ postgres sẵn sàng
            sleep 15

            # Khởi động backend — JWT key đọc từ file, truyền trực tiếp vào biến môi trường trước lệnh docker compose
            JWT_PRIVATE_KEY="$(cat jwt-private.pem)" \
            JWT_PUBLIC_KEY="$(cat jwt-public.pem)" \
            JWT_VERIFICATION_KEYS="managed-rsa::$(cat jwt-public.pem)" \
            docker compose -p socialblog-backend -f backend.compose.yml --env-file .env up -d --remove-orphans

            # Dọn image cũ
            docker image prune -f

            echo "Deploy hoat dong tai http://${{ secrets.VPS_HOST }}:8080"
