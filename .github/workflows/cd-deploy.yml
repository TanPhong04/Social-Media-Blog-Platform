name: CD — Deploy to VPS

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main, dev]
    types: [completed]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Bước 1: Copy compose files & init.sql lên VPS ──────────
      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/compose/backend.compose.yml,infra/docker/infra.compose.yml,infra/postgres/init.sql"
          target: /opt/socialblog
          strip_components: 0

      # ── Bước 2: SSH vào VPS và chạy deploy ─────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/opt/socialblog
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            BRANCH_TAG="${BRANCH//\//-}"

            cd $APP_DIR

            # Dọn dẹp cấu trúc thư mục sau khi scp
            [ -f deploy/compose/backend.compose.yml ] && mv deploy/compose/backend.compose.yml . 2>/dev/null || true
            [ -f infra/docker/infra.compose.yml ] && mv infra/docker/infra.compose.yml . 2>/dev/null || true
            [ -f infra/postgres/init.sql ] && mv infra/postgres/init.sql . 2>/dev/null || true
            rm -rf deploy infra 2>/dev/null || true

            # Ghi file .env
            cat > .env << 'ENVEOF'
            IMAGE_REGISTRY=ghcr.io
            IMAGE_NAMESPACE=tanphong04/social-media-blog-platform
            SPRING_PROFILES_ACTIVE=prod
            OUTBOX_PUBLISHER_ENABLED=true
            KAFKA_CONSUMER_ENABLED=true
            BACKEND_NETWORK=social-blog-backend
            GATEWAY_PORT=8080
            ENVEOF

            # Append secrets vào .env
            echo "IMAGE_TAG=${BRANCH_TAG}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "JWT_ISSUER=http://${{ secrets.VPS_HOST }}:8080" >> .env
            echo "JWT_KEY_ID=managed-rsa" >> .env
            printf 'JWT_PRIVATE_KEY=%s\n' "${{ secrets.JWT_PRIVATE_KEY }}" >> .env
            printf 'JWT_PUBLIC_KEY=%s\n' "${{ secrets.JWT_PUBLIC_KEY }}" >> .env
            printf 'JWT_VERIFICATION_KEYS=%s\n' "${{ secrets.JWT_PUBLIC_KEY }}" >> .env

            # Login GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull images mới nhất
            SERVICES=(user-service article-service comment-service interaction-service follower-service notification-service api-gateway)
            for svc in "${SERVICES[@]}"; do
              echo "Pulling ${svc}:${BRANCH_TAG}..."
              docker pull "ghcr.io/tanphong04/social-media-blog-platform/${svc}:${BRANCH_TAG}" || true
            done

            # Khởi động infra (postgres, kafka, redis) trước
            docker compose -f infra.compose.yml --env-file .env up -d

            # Chờ postgres sẵn sàng
            echo "⏳ Chờ PostgreSQL..."
            sleep 15

            # Khởi động backend services
            docker compose -f backend.compose.yml --env-file .env up -d --remove-orphans

            # Dọn image cũ
            docker image prune -f

            echo "✅ Deploy hoàn tất! API đang chạy tại http://${{ secrets.VPS_HOST }}:8080"
