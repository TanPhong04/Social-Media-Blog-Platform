name: CD — Deploy to VPS

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main, dev]
    types: [completed]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # ── Variables ──────────────────────────────────────────────
            APP_DIR=/opt/socialblog
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            IMAGE_TAG=${IMAGE_TAG::12}
            BRANCH=${{ github.event.workflow_run.head_branch }}

            mkdir -p $APP_DIR
            cd $APP_DIR

            # ── Write .env ─────────────────────────────────────────────
            cat > .env <<EOF
            IMAGE_REGISTRY=ghcr.io
            IMAGE_NAMESPACE=tanphong04/social-media-blog-platform
            IMAGE_TAG=${BRANCH//\//-}
            SPRING_PROFILES_ACTIVE=prod
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_ISSUER=http://${{ secrets.VPS_HOST }}:8080
            JWT_KEY_ID=managed-rsa
            JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}
            JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}
            JWT_VERIFICATION_KEYS=${{ secrets.JWT_PUBLIC_KEY }}
            CORS_ALLOWED_ORIGINS=*
            GATEWAY_PORT=8080
            EOF

            # ── Pull infra compose & backend compose ───────────────────
            curl -fsSL \
              https://raw.githubusercontent.com/TanPhong04/Social-Media-Blog-Platform/${BRANCH}/infra/postgres/init.sql \
              -o /tmp/init.sql 2>/dev/null || true

            # ── Login to GHCR ──────────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull latest images ─────────────────────────────────────
            SERVICES=(user-service article-service comment-service interaction-service follower-service notification-service api-gateway)
            for svc in "${SERVICES[@]}"; do
              docker pull ghcr.io/tanphong04/social-media-blog-platform/${svc}:${BRANCH//\//-} || true
            done

            # ── Restart stack ──────────────────────────────────────────
            docker compose -f $APP_DIR/infra.compose.yml \
                           -f $APP_DIR/backend.compose.yml \
                           --env-file $APP_DIR/.env \
                           up -d --remove-orphans

            # ── Cleanup old images ─────────────────────────────────────
            docker image prune -f

            echo "✅ Deploy completed!"

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/compose/backend.compose.yml,infra/docker/infra.compose.yml"
          target: /opt/socialblog
          strip_components: 2
