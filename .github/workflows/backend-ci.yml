name: Backend CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths-ignore:
      - 'frontend/**'
      - 'frontend-react/**'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'frontend/**'
      - 'frontend-react/**'

permissions:
  contents: read
  packages: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build song song theo số CPU có sẵn
      - name: Test and package
        run: mvn package -T 1C --no-transfer-progress

      # Upload JAR để job build-images dùng lại, không cần compile lại
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            backend/*/target/*.jar
          retention-days: 1

  build-images:
    runs-on: ubuntu-latest
    needs: test-and-package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tải JAR từ job trước, không cần compile lại
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build và push 7 images song song, dùng GHA cache cho Docker layers
      - name: Build and push all images in parallel
        shell: bash
        run: |
          namespace="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image_tag="${GITHUB_SHA::12}"
          branch_tag="${GITHUB_REF_NAME//\//-}"

          build_and_push() {
            local service=$1
            echo "🔨 Building ${service}..."
            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=gha,scope=${service} \
              --cache-to   type=gha,scope=${service},mode=max \
              --tag "ghcr.io/${namespace}/${service}:${image_tag}" \
              --tag "ghcr.io/${namespace}/${service}:${branch_tag}" \
              --push \
              backend/${service}
            echo "✅ ${service} done"
          }

          services=(
            user-service
            article-service
            comment-service
            interaction-service
            follower-service
            notification-service
            api-gateway
          )

          # Chạy song song tất cả
          for svc in "${services[@]}"; do
            build_and_push "$svc" &
          done

          # Chờ tất cả hoàn thành
          wait
          echo "🚀 All images built and pushed!"
