name: Backend CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'frontend/**'
      - 'frontend-react/**'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'frontend/**'
      - 'frontend-react/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn package -T 1C --no-transfer-progress

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all images in parallel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        run: |
          namespace="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image_tag="${GITHUB_SHA::12}"
          branch_tag="${GITHUB_REF_NAME//\//-}"

          build_and_push() {
            local service=$1
            echo "🔨 Building ${service}..."
            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=gha,scope=${service} \
              --cache-to   type=gha,scope=${service},mode=max \
              --tag "ghcr.io/${namespace}/${service}:${image_tag}" \
              --tag "ghcr.io/${namespace}/${service}:${branch_tag}" \
              --push \
              backend/${service}
            echo "✅ ${service} done"
          }

          services=(
            user-service
            article-service
            comment-service
            interaction-service
            follower-service
            notification-service
            api-gateway
          )

          for svc in "${services[@]}"; do
            build_and_push "$svc" &
          done

          wait
          echo "🚀 All images built and pushed!"
